# /etc/nginx/conf.d/cryptopulse.conf
# Proxy inverso: expone Streamlit (127.0.0.1:8501) en el puerto 80 público.

server {
    # default_server: Amazon Linux 2023's stock nginx.conf ships its own
    # catch-all "server_name _;" block on :80 (serving /usr/share/nginx/html).
    # Without an explicit default_server, nginx picks whichever block it
    # parses first as the implicit default — which is the stock one, since
    # nginx.conf's own server block is defined before the conf.d/*.conf
    # include is expanded. That silently serves the "Welcome to nginx!" page
    # instead of proxying to Streamlit. default_server forces this block to
    # win regardless of parse order.
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit usa WebSockets para las actualizaciones en vivo
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
